set -g prefix C-s

set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
set -g mouse on

bind | split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind -n S-left prev
bind -n S-right next
bind -n S-down new-window

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g mode-style "fg=#7e9cd8,bg=#2a2a37"

set -g message-style "fg=#7e9cd8,bg=#2a2a37"
set -g message-command-style "fg=#7e9cd8,bg=#2a2a37"

set -g pane-border-style "fg=#2a2a37"
set -g pane-active-border-style "fg=#7e9cd8"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#7e9cd8,bg=#1f1f28"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#1b1d2b,bg=#7e9cd8,bold] #S #[fg=#7e9cd8,bg=#1f1f28,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#1f1f28,bg=#1f1f28,nobold,nounderscore,noitalics]#[fg=#7e9cd8,bg=#1f1f28] #{prefix_highlight} #[fg=#2a2a37,bg=#1f1f28,nobold,nounderscore,noitalics]#[fg=#7e9cd8,bg=#2a2a37] %Y-%m-%d  %I:%M %p #[fg=#7e9cd8,bg=#2a2a37,nobold,nounderscore,noitalics]#[fg=#1b1d2b,bg=#7e9cd8,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
   set -g status-right "#[fg=#1f1f28,bg=#1f1f28,nobold,nounderscore,noitalics]#[fg=#7e9cd8,bg=#1f1f28] #{prefix_highlight} #[fg=#2a2a37,bg=#1f1f28,nobold,nounderscore,noitalics]#[fg=#7e9cd8,bg=#2a2a37] %Y-%m-%d  %H:%M #[fg=#7e9cd8,bg=#2a2a37,nobold,nounderscore,noitalics]#[fg=#1b1d2b,bg=#7e9cd8,bold] #h "
 }

setw -g window-status-activity-style "underscore,fg=#c8c093,bg=#1f1f28"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#c8c093,bg=#1f1f28"
setw -g window-status-format "#[fg=#1f1f28,bg=#1f1f28,nobold,nounderscore,noitalics]#[default] #I #W #F#[fg=#1f1f28,bg=#1f1f28,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#1f1f28,bg=#2a2a37,nobold,nounderscore,noitalics]#[fg=#7e9cd8,bg=#2a2a37,bold] #I #W #F#[fg=#2a2a37,bg=#1f1f28,nobold,nounderscore,noitalics]"

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=#c0a36e]#[bg=#1f1f28]#[fg=#1f1f28]#[bg=#c0a36e]"
set -g @prefix_highlight_output_suffix ""

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

run '~/.config/tmux/plugins/tpm/tpm'
